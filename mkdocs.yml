site_name: ContentTool
site_description: Documentation for building Phoenix Point content mods with ContentTool.
site_url: https://ubermorgott.github.io/PhoenixPoint-Mod-ContentTool/
repo_url: https://github.com/UberMorgott/PhoenixPoint-Mod-ContentTool
repo_name: UberMorgott/PhoenixPoint-Mod-ContentTool
copyright: CC BY-NC 4.0 - Morgott

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: index.md
  - 10-minute quickstart: quickstart.md
  - Concepts:
      - Replace, Add or Build: concepts/routes.md
      - "The lifecycle: validate, bake, apply, verify, package": concepts/lifecycle.md
  - Recipes:
      - Recipe index: recipes/index.md
      - Textures and icons: recipes/textures.md
      - Material property values: recipes/material-properties.md
      - Meshes: recipes/meshes.md
      - Animated models: recipes/animated-models.md
      - Animation contract: recipes/animation-contract.md
      - Replace sounds: recipes/sounds-replace.md
      - Add new sounds: recipes/sounds-add.md
      - Videos: recipes/videos.md
      - Behaviour DLL: recipes/behavior-dll.md
      - Creatures: recipes/creature.md
      - Humanoid soldiers: recipes/humanoid-soldier.md
      - Replace a character body: recipes/replace-character-body.md
      - Replace a weapon's art: recipes/weapon-replace.md
      - Add new weapons: recipes/weapon-add.md
      - Replace an armour set: recipes/armour-set.md
  - Tools:
      - The in-game bench: bench/index.md
      - Model Doctor: bench/model-doctor.md
      - "Build & share tab": bench/lifecycle-tab.md
      - Find game content: find-content/index.md
  - Reference:
      - Console commands: reference/console-commands.md
      - ppcontent.json: reference/ppcontent-json.md
      - meta.json: reference/meta-json.md
      - Project folder and file rules: reference/project-files.md
      - Messages by stage: reference/messages.md
  - Examples: examples/index.md
  - Known limitations: known-limitations.md
  - What's new: whats-new.md
