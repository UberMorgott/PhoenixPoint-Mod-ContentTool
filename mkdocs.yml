site_name: ContentTool
site_description: Documentation for building Phoenix Point content mods with ContentTool.
site_url: https://ubermorgott.github.io/PhoenixPoint-Mod-ContentTool/
repo_url: https://github.com/UberMorgott/PhoenixPoint-Mod-ContentTool
repo_name: UberMorgott/PhoenixPoint-Mod-ContentTool
copyright: CC BY-NC 4.0 - Morgott

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Start here: index.md
  - Your first working mod:
      - First green bake: getting-started/first-mod.md
      - Choose a route: getting-started/choose-a-route.md
      - Bake, test, package: getting-started/lifecycle.md
  - Project files: reference/project-files.md
  - Find game content: find-content/index.md
  - Read bake failures: troubleshooting/bake-errors.md
  - Recipes:
      - Recipe index: recipes/index.md
      - Textures and icons: recipes/textures.md
      - Material property values: recipes/material-properties.md
      - Meshes: recipes/meshes.md
      - Animated models: recipes/animated-models.md
      - Sounds: recipes/sounds.md
      - Videos: recipes/videos.md
      - Creatures: recipes/creature.md
      - Humanoid soldiers: recipes/humanoid-soldier.md
      - Replace a character body: recipes/replace-character-body.md
      - Weapons: recipes/weapon.md
      - Behaviour DLL: recipes/behavior-dll.md
      - Animation contract: recipes/animation-contract.md
  - Worked examples: examples/index.md
